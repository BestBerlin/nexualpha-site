<!doctype html>
<html lang="en">
  <head>
    <script>if(window.HTMLElement&&HTMLElement.prototype.togglePopover)document.documentElement.classList.add("hx-popover")</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <meta name="application-name" content="NexuAlpha" />
    <meta name="description" content="NexuAlpha is an independent platform research and comparison experience built around verified coverage, fee rebate benchmarks, and official source context." />
    <title translate="no" lang="en">NexuAlpha — Independent platform research</title>
    <link rel="icon" type="image/svg+xml" href="/brand/nexualpha/nexualpha-round.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/nexualpha/nexualpha-apple-touch-v1.png" />
    <!-- Geist (home hero, v5 pages): preload so the first paint already uses it (22 KB each, same origin). -->
    <link rel="preload" href="/fonts/geist/geist-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Visitor analytics: self-hosted Umami proxied same-origin under /insights/ (cookieless, ~2 KB, counts nexualpha.com only). -->
    <script defer src="/insights/s.js" data-website-id="d04d1cee-c67e-47a4-a6db-f70c3a766761" data-domains="nexualpha.com"></script>
    <!-- Partner clicks: /go/<partner> redirects and outbound links become Umami events (hrefs unchanged). -->
    <script>document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]"),t=window.umami,u;if(!a||!t)return;try{u=new URL(a.href,location.href)}catch(_){return}if(u.origin===location.origin){if(u.pathname.indexOf("/go/")===0)t.track("go-click",{partner:u.pathname.split("/")[2]||"",page:location.pathname})}else if(/^https?:$/.test(u.protocol))t.track("outbound-click",{host:u.hostname,page:location.pathname})},true)</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="/motion/inner-motion.js" defer></script>
  </body>
</html>
